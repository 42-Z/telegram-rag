# Боевой стек на VPS — по образцу Mimic42.
#
# База — облачный Postgres (Supabase или Neon), на сервере её нет: строка
# подключения DATABASE_URL лежит в /etc/telegram-rag.env вместе с остальными
# секретами (права 600, создаётся руками, в репозиторий не попадает).
# Переменные уровня compose — в .env рядом (пишет deploy.sh).
#
# Образ собирает GitHub Actions (.github/workflows/deploy.yml) и кладёт в
# ghcr.io; сервер только скачивает и перезапускает. Порт опубликован только
# на loopback: снаружи его отдаёт системный Caddy (см. Caddyfile.snippet).

services:
  app:
    image: ghcr.io/42-z/telegram-rag:${IMAGE_TAG:-latest}
    container_name: telegram-rag-app
    pull_policy: always
    restart: unless-stopped
    env_file:
      - path: /etc/telegram-rag.env
        required: true
    ports:
      - "127.0.0.1:${APP_PORT:-8110}:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 1g
    mem_reservation: 256m
    security_opt:
      - no-new-privileges:true

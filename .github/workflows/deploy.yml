# Выкатка на VPS: проверки (ci.yml) → образ в GHCR → SSH → deploy.sh с откатом
# → проверка адреса снаружи. Запускается только вручную (Actions → Deploy →
# Run workflow) и только из main. Автовыкатки на пуш нет: пока секреты и
# окружение production не заведены, каждый merge заканчивался бы ошибкой.
#
# Настройка (один раз, Settings → Environments → production):
# - Deployment branches: только main.
# - Secrets: DEPLOY_SSH_KEY (ed25519 без пароля), DEPLOY_HOST, DEPLOY_USER,
#   DEPLOY_KNOWN_HOSTS (вывод `ssh-keyscan`, отпечаток сверен с консолью VPS).
# - Variables: DEPLOY_PATH (/root/sites/telegram-rag), PUBLIC_URL
#   (https://telegram-rag.zomb.top), DEPLOY_PORT (если не 22).
# - Пакет ghcr.io/42-z/telegram-rag переключить в PUBLIC, чтобы сервер
#   скачивал образ без docker login.

name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: production-deploy-telegram-rag
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/42-z/telegram-rag

jobs:
  guard:
    name: Main only
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Выкатывать можно только main, запуск был из ${GITHUB_REF_NAME}"
          exit 1

  checks:
    name: CI
    needs: [guard]
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    needs: [checks]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=telegram-rag
          cache-to: type=gha,mode=max,scope=telegram-rag

  deploy:
    name: Roll out to VPS
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      # Нужны только compose-файл и deploy.sh.
      - name: Check out deploy files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy
          persist-credentials: false

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Не задан ${name} (Settings → Environments → production)"
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy compose files
        run: scp deploy/docker-compose.yml deploy/deploy.sh "production:${DEPLOY_PATH}/"

      - name: Roll out
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          remote="cd $(printf '%q' "$DEPLOY_PATH") && bash deploy.sh $(printf '%q' "$IMAGE_TAG")"
          # shellcheck disable=SC2029  # команду собирает клиент, значения экранированы выше
          ssh production "$remote"

      # deploy.sh уже дождался здоровья контейнера; здесь проверяется путь снаружи
      # (DNS, Caddy, сертификат). /health Caddy наружу не отдаёт, поэтому адрес /.
      - name: Smoke test
        run: >
          curl --fail --silent --show-error --output /dev/null
          --max-time 10 --retry 5 --retry-delay 10 --retry-all-errors
          "${PUBLIC_URL}/"

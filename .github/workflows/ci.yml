# Проверки кода: типы и тесты. Запускаются на каждом PR и пуше в main, а
# deploy.yml вызывает этот же файл перед сборкой образа.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# У PR новый коммит отменяет прогон по старому. Остальные запуски получают
# уникальную группу и не мешают друг другу — в том числе вызов из deploy.yml.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # Тесты media.test.ts гоняют настоящий ffmpeg; в образе runner'а его нет.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
